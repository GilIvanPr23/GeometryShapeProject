name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore
      run: dotnet restore GeometryShape.slnx
      
    - name: Build
      run: dotnet build GeometryShape.slnx --no-restore
      
    - name: Test
      run: dotnet test GeometryShape.slnx --no-build --verbosity normal